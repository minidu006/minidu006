<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#151a2d"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="title" x1="300" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#f778ba;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#f778ba;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bc8cff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f778ba" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="line" x1="380" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#30363d" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <clipPath id="round">
      <rect width="1000" height="280" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- floating glow orbs -->
    <circle cx="180" cy="80" r="110" fill="#58a6ff" opacity="0.28" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;70 30;0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="190" r="130" fill="#bc8cff" opacity="0.28" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-80 -30;0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="30" r="70" fill="#f778ba" opacity="0.22" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 40;0 0" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- animated waves -->
    <path d="M0 232 q125 -34 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V280 H0 Z" fill="url(#wave1)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-500 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M0 248 q125 30 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V280 H0 Z" fill="url(#wave2)">
      <animateTransform attributeName="transform" type="translate" values="-500 0;0 0" dur="9s" repeatCount="indefinite"/>
    </path>

    <!-- intro -->
    <text x="500" y="82" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="17" letter-spacing="8" fill="#8b949e" opacity="0">
      HELLO WORLD, I'M
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- name -->
    <text x="500" y="158" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="10" fill="url(#title)" opacity="0">
      MINIDU
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.5s" fill="freeze"/>
    </text>

    <!-- animated underline -->
    <line x1="380" y1="178" x2="620" y2="178" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="240" stroke-dashoffset="240">
      <animate attributeName="stroke-dashoffset" values="240;0" dur="1.4s" begin="0.9s" fill="freeze"/>
    </line>

    <!-- rotating taglines -->
    <g font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="23" fill="#c9d1d9" text-anchor="middle">
      <text x="500" y="215" opacity="0">Android Developer  •  Kotlin  •  Firebase
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.23;0.25;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="215" opacity="0">Full-Stack Web  •  PHP  •  MySQL
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.48;0.5;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="215" opacity="0">Desktop Apps  •  Java  •  Swing
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.73;0.75;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="215" opacity="0">Building clean, useful software
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.78;0.97;1" dur="16s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="278" rx="20" stroke="#30363d" stroke-width="2"/>
</svg>
